<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mountain Village</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: fixed; bottom: 10px; left: 10px;
      color: white; font-family: monospace; font-size: 13px;
      background: rgba(0,0,0,0.5); padding: 8px; border-radius: 4px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="info">
    Wow Factor: Windmill with animated rotating blades + Day-Night Cycle
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
  }
}
</script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    var loader = new THREE.TextureLoader();

    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    //scene.background = new THREE.Color(0x87ceeb);

    var skyboxLoader = new THREE.CubeTextureLoader();
    skyboxLoader.setPath('skybox/');
    var skyboxTexture = skyboxLoader.load([
        'px.png', 'nx.png',
        'py.png', 'ny.png',
        'pz.png', 'nz.png'
    ]);

    scene.background = skyboxTexture;

    var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(10, 8, 15);
    camera.lookAt(0, 0, 0);

    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.1;

    var dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    var ambientLight = new THREE.AmbientLight(0x404040, 0.5);
    scene.add(ambientLight);

    var pointLight = new THREE.PointLight(0xffaa33, 1.5, 20);
    pointLight.position.set(-2, 3, 2);
    pointLight.castShadow = true;
    scene.add(pointLight);

    var pointHelper = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffaa33 })
    );

    pointHelper.position.copy(pointLight.position);
    scene.add(pointHelper);

    var gltfLoader = new GLTFLoader();
    gltfLoader.load('models/scene.glb', function(gltf) {
        var model = gltf.scene;
        model.position.set(-6, -1, -8);
        model.scale.set(0.01, 0.01, 0.01);
        model.traverse(function(child) {
            if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
            }
      });
        scene.add(model);
        console.log('GLB model loaded');
    }, undefined, function(error) {
        console.error('Error loading model.');
    });

    var cube1 = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0xff4444 })
    );
    cube1.position.set(-3, 0.5, 0);
    cube1.castShadow = true;
    scene.add(cube1);

    var cube2 = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x44ff44 })
    );
    cube2.position.set(0, 0.5, 0);
    cube2.castShadow = true;
    scene.add(cube2);

    var cube3 = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x4444ff })
    );
    cube3.position.set(3, 0.5, 0);
    cube3.castShadow = true;
    scene.add(cube3);

    // Other elements for the vilage environment

    // House 1 body
    var house1 = new THREE.Mesh(
      new THREE.BoxGeometry(3, 2, 3),
      new THREE.MeshStandardMaterial({ map: woodTex })
    );
    house1.position.set(-8, 1, 5);
    house1.castShadow = true;
    scene.add(house1);

    // House 1 roof
    var roof1 = new THREE.Mesh(
      new THREE.ConeGeometry(2.5, 1.5, 4),
      new THREE.MeshStandardMaterial({ color: 0x8b0000 })
    );
    roof1.position.set(-8, 2.75, 5);
    roof1.rotation.y = Math.PI / 4;
    roof1.castShadow = true;
    scene.add(roof1);

    // House 2 house
    var house2 = new THREE.Mesh(
      new THREE.BoxGeometry(2.5, 2.5, 2.5),
      new THREE.MeshStandardMaterial({ map: woodTex })
    );
    house2.position.set(8, 1.25, 6);
    house2.castShadow = true;
    scene.add(house2);

    var roof2 = new THREE.Mesh(
      new THREE.ConeGeometry(2.2, 1.5, 4),
      new THREE.MeshStandardMaterial({ color: 0x654321 })
    );
    roof2.position.set(8, 3.25, 6);
    roof2.rotation.y = Math.PI / 4;
    roof2.castShadow = true;
    scene.add(roof2);

    // --- Trees ---

    function makeTree(x, z) {
        var trunk = new THREE.Mesh(
            new THREE.CylinderGeometry(0.15, 0.2, 1.5, 8),
            new THREE.MeshStandardMaterial({ color: 0x8B4513 })
        );
        trunk.position.set(x, 0.75, z);
        trunk.castShadow = true;
        scene.add(trunk);

        var leaves = new THREE.Mesh(
            new THREE.SphereGeometry(0.8, 8, 8),
            new THREE.MeshStandardMaterial({ color: 0x228B22 })
        );

        leaves.position.set(x, 2.0, z);
        leaves.castShadow = true;
        scene.add(leaves);
    }

    // Multiple Trees
    makeTree(-6, 8);
    makeTree(-2, 10);
    makeTree(3, 9);
    makeTree(6, -5);
    makeTree(7, -9);
    makeTree(10, -2);
    makeTree(9, -6);
    makeTree(-8, -1);

    // Fence
    for (var i = 0; i < 10; i++) {
      var post = new THREE.Mesh(

        new THREE.CylinderGeometry(0.05, 0.05, 1, 6),
        new THREE.MeshStandardMaterial({ color: 0x8B6914 })
      );
      post.position.set(-8 + i * 1.5, 0.5, 3);
      post.castShadow = true;
      scene.add(post);
    }

    // Pond
    var pond = new THREE.Mesh(
        new THREE.CircleGeometry(2, 32),
        new THREE.MeshStandardMaterial({ color: 0x4488cc, transparent: true, opacity: 0.7 })
    );
    pond.rotation.x = -Math.PI / 2;
    pond.position.set(6, 0.01, 0);
    scene.add(pond);

    // Rocks near pond
    var rock1 = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 6, 6),
        new THREE.MeshStandardMaterial({ color: 0x777777 })
    );
    rock1.position.set(5.5, 0.5, 2);
    rock1.scale.set(1, 0.6, 1);
    scene.add(rock1);

    var rock2 = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 6, 6),
        new THREE.MeshStandardMaterial({ color: 0x666666 })
    );
    rock2.position.set(4.5, 0.2, 1.5);
    rock2.scale.set(1.2, 0.5, 1);
    scene.add(rock2);

    var rock3 = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 5, 4),
        new THREE.MeshStandardMaterial({ color: 0x666666 })
    );
    rock3.position.set(6, 0.2, -2.3);
    rock3.scale.set(2.5, 1.2, 2.0);
    scene.add(rock3);    

    // A Well

    var wellBase = new THREE.Mesh(
      new THREE.CylinderGeometry(0.8, 0.8, 0.8, 12),
      new THREE.MeshStandardMaterial({ color: 0x999999 })
    );
    wellBase.position.set(0, 0.4, 4);
    wellBase.castShadow = true;
    scene.add(wellBase);

    var wellRoof = new THREE.Mesh(
      new THREE.ConeGeometry(1.0, 0.8, 4),
      new THREE.MeshStandardMaterial({ color: 0x8b0000 })
    );
    wellRoof.position.set(0, 1.6, 4);
    wellRoof.rotation.y = Math.PI / 4;
    scene.add(wellRoof);

    // Stone Paths
    for (var i = 0; i < 5; i++) {
      var stone = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.35, 0.05, 8),
        new THREE.MeshStandardMaterial({ color: 0xaaaaaa })
      );
      stone.position.set(-1 + i * 1.2, 0.03, 4);
      stone.rotation.x = -Math.PI / 2;
      scene.add(stone);
    }

    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Wow Factor
    // WindMill

    var windmillBase = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.8, 4, 8),
      new THREE.MeshStandardMaterial({ color: 0xccbbaa })
    );
    windmillBase.position.set(-10, 2, -5);
    windmillBase.castShadow = true;
    scene.add(windmillBase);

    var windmillTop = new THREE.Mesh(
      new THREE.ConeGeometry(0.8, 1, 8),
      new THREE.MeshStandardMaterial({ color: 0x8b0000 })
    );
    windmillTop.position.set(-10, 4.5, -5);
    scene.add(windmillTop);

    var bladeGroup = new THREE.Group();
    bladeGroup.position.set(-10, 3.5, -4.5);

    for (var b = 0; b < 4; b++) {
      var blade = new THREE.Mesh(
        new THREE.BoxGeometry(0.15, 2.5, 0.05),
        new THREE.MeshStandardMaterial({ color: 0xddc999 })
      );
      blade.position.set(0, 1.25, 0);

      var bladePivot = new THREE.Group();
      bladePivot.add(blade);
      bladePivot.rotation.z = (b * Math.PI) / 2;
      bladeGroup.add(bladePivot);
    }

    scene.add(bladeGroup);

    var grassTex = loader.load('textures/grass.png');
    grassTex.wrapS = THREE.RepeatWrapping;
    grassTex.wrapT = THREE.RepeatWrapping;
    grassTex.repeat.set(10, 10);

    var ground = new THREE.Mesh(
        new THREE.PlaneGeometry(50, 50),
        new THREE.MeshStandardMaterial({ map: grassTex })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    var woodTex = loader.load('textures/wall.png');
    cube1.material = new THREE.MeshStandardMaterial({ map: woodTex });

    function animate(time) {
        time *= 0.001;

        cube1.rotation.x = time;
        cube1.rotation.y = time * 0.5;

        cube2.rotation.y = time;
        cube2.rotation.z = time * 0.3;

        cube3.rotation.x = time * 0.7;
        cube3.rotation.y = time;

        bladeGroup.rotation.z = time * 0.8;

        var cycle = (Math.sin(time * 0.2) + 1) / 2;
        var dayColor = new THREE.Color(0xffffff);
        var nightColor = new THREE.Color(0x111133);
        var currentColor = dayColor.clone().lerp(nightColor, cycle);
        dirLight.color.copy(currentColor);
        dirLight.intensity = 1.5 - cycle * 1.0;

        ambientLight.intensity = 1.0 - cycle * 0.6;

        pointLight.intensity = 0.5 + cycle * 2.5;

        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
