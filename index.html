<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mountain Village</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: fixed; bottom: 10px; left: 10px;
      color: white; font-family: monospace; font-size: 13px;
      background: rgba(0,0,0,0.5); padding: 8px; border-radius: 4px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="info">
    Needs to be decided.
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
  }
}
</script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    var loader = new THREE.TextureLoader();

    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    //scene.background = new THREE.Color(0x87ceeb);

    var skyboxLoader = new THREE.CubeTextureLoader();
    skyboxLoader.setPath('skybox/');
    var skyboxTexture = skyboxLoader.load([
        'px.png', 'nx.png',
        'py.png', 'ny.png',
        'pz.png', 'nz.png'
    ]);

    scene.background = skyboxTexture;

    var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(10, 8, 15);
    camera.lookAt(0, 0, 0);

    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.1;

    var dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    var ambientLight = new THREE.AmbientLight(0x404040, 0.5);
    scene.add(ambientLight);

    var pointLight = new THREE.PointLight(0xffaa33, 1.5, 20);
    pointLight.position.set(-2, 3, 2);
    pointLight.castShadow = true;
    scene.add(pointLight);

    var pointHelper = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffaa33 })
    );
    
    pointHelper.position.copy(pointLight.position);
    scene.add(pointHelper);

    var cube1 = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0xff4444 })
    );
    cube1.position.set(-3, 0.5, 0);
    cube1.castShadow = true;
    scene.add(cube1);

    var cube2 = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x44ff44 })
    );
    cube2.position.set(0, 0.5, 0);
    cube2.castShadow = true;
    scene.add(cube2);

    var cube3 = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x4444ff })
    );
    cube3.position.set(3, 0.5, 0);
    cube3.castShadow = true;
    scene.add(cube3);

    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    var grassTex = loader.load('textures/grass.png');
    grassTex.wrapS = THREE.RepeatWrapping;
    grassTex.wrapT = THREE.RepeatWrapping;
    grassTex.repeat.set(10, 10);

    var ground = new THREE.Mesh(
        new THREE.PlaneGeometry(50, 50),
        new THREE.MeshStandardMaterial({ map: grassTex })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    var woodTex = loader.load('textures/wall.png');
    cube1.material = new THREE.MeshStandardMaterial({ map: woodTex });

    function animate(time) {
        time *= 0.001;

        cube1.rotation.x = time;
        cube1.rotation.y = time * 0.5;

        cube2.rotation.y = time;
        cube2.rotation.z = time * 0.3;

        cube3.rotation.x = time * 0.7;
        cube3.rotation.y = time;

        controls.update();    
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
